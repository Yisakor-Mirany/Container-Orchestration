# ContainerOps Dashboard - Docker Compose orchestration
# Repository: Container-Orchestration
#
#   docker compose build
#   docker compose up -d                 # starts nginx + ${WEB_REPLICAS:-3} web replicas
#   docker compose up -d --scale web=3   # explicit scale
#   open http://localhost:8080
#
# Values in ${...} are read from the shell or an optional .env file
# (see .env.example). No secrets are required.

name: ${COMPOSE_PROJECT_NAME:-container-orchestration}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------------
  # Node.js application (horizontally scalable)
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: containerops-dashboard:1.0.0
    # No container_name and no host "ports:" mapping: either would prevent
    # running more than one replica. Nginx reaches replicas over the
    # internal network instead.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"              # must match nginx/nginx.conf (web:3000)
      APP_NAME: ${APP_NAME:-ContainerOps Dashboard}
      APP_ENV: ${APP_ENV:-production}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    user: "10001:10001"         # same non-root user as the Dockerfile USER
    init: true                  # tiny init as PID 1: signal forwarding + zombie reaping
    read_only: true             # immutable root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL                     # Node.js on port 3000 needs no Linux capabilities
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped     # restart crashed/killed containers
    stop_grace_period: 15s      # > SHUTDOWN_TIMEOUT_MS so shutdown can finish
    healthcheck:
      test: ["CMD", "node", "app/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    deploy:
      replicas: ${WEB_REPLICAS:-3}
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 100
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - backend
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Nginx reverse proxy / load balancer (single public entry point)
  # -------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL                     # unprivileged image, port 8080 > 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # wget is included in the nginx alpine image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
          pids: 100
        reservations:
          cpus: "0.05"
          memory: 16M
    networks:
      - frontend
      - backend
    logging: *default-logging

networks:
  # Publicly reachable side: only Nginx is attached.
  frontend:
    driver: bridge
  # Private application network: no external connectivity (internal: true).
  backend:
    driver: bridge
    internal: true
