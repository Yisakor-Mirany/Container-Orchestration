# ContainerOps Dashboard - Nginx reverse proxy / load balancer
# Image: nginxinc/nginx-unprivileged (runs as UID 101, listens on 8080)
#
# Load balancing design
# ---------------------
# * "web" is the Docker Compose service name. Docker's embedded DNS server
#   (127.0.0.11) answers it with one A record PER RUNNING REPLICA.
# * The `resolve` parameter on the upstream server (available in Nginx
#   open source since 1.27.3) makes Nginx re-query DNS periodically
#   (governed by `resolver ... valid=`) and update the upstream member list
#   without a reload. This handles replicas being added, removed or
#   restarted with a new IP address.
# * Requests are distributed round-robin; failed peers are retried on the
#   next replica (proxy_next_upstream) and temporarily marked down
#   (max_fails / fail_timeout - passive health checking only).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Writable temp paths live on a tmpfs (/tmp) because the container
    # root filesystem is mounted read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30s;
    server_tokens   off;          # hide the Nginx version
    client_max_body_size 16k;     # the app accepts no request bodies

    log_format upstreamlog '$remote_addr - [$time_local] "$request" $status '
                           '$body_bytes_sent rt=$request_time '
                           'upstream=$upstream_addr ust=$upstream_status '
                           'urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout upstreamlog;

    # Docker embedded DNS. valid=5s => re-resolve "web" every 5 seconds.
    # ipv6=off because the Compose networks here are IPv4-only.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream web_backend {
        # Shared memory zone is required for runtime (re-resolved) servers.
        zone web_backend 64k;

        # One logical entry expands to every replica IP returned by DNS.
        server web:3000 resolve max_fails=1 fail_timeout=10s;

        # Reuse upstream TCP connections.
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Nginx's own liveness endpoint (used by the container HEALTHCHECK).
        # Security headers for proxied responses are set by the Node.js app.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # enable upstream keepalive

            # Forward client / request information to the app.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Request-ID      $request_id;

            # Timeouts. A short connect timeout lets Nginx fail over quickly
            # when a replica has just died (its IP may silently drop packets).
            proxy_connect_timeout 1s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;

            # Fail over to another replica if one is down or restarting.
            # Safe here because every endpoint is an idempotent GET.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }
    }
}
